# Header bảo mật cho FE (T-41 D-1). Được `include` trong server{} và trong TỪNG location có add_header riêng
# (xem nginx.conf): nginx KHÔNG cộng dồn add_header giữa các cấp, location nào có add_header thì mất sạch add_header
# của cấp cha. Thêm/bớt header ở ĐÂY (một chỗ); test ops/tests/nginx-security-headers.test.sh bắt location thiếu include.
# `always`: gắn cả cho 4xx/5xx (404 do try_files, 502 của /api/). KHÔNG có HSTS ở origin: Cloudflare bật ở edge (docs 06, mục 14.5).
# KHÔNG có CSP: chưa chứng minh được chính sách không làm hỏng app (docs 06, mục 14.5).
# Image nginx KHÔNG envsubst file này (chỉ /etc/nginx/templates/*.template), nên không cần tránh `$`.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
