<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Không có kết nối – STND</title>
    <!-- Trang tĩnh độc lập: không phụ thuộc JS/CSS của app để vẫn hiển thị khi mất mạng. -->
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #1d2939;
        background: #f9fafb;
        text-align: center;
      }
      main { max-width: 22rem; }
      h1 { margin: 0 0 0.5rem; font-size: 1.375rem; }
      p { margin: 0 0 1.5rem; font-size: 0.9375rem; line-height: 1.5; color: #475467; }
      button {
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: #465fff;
        cursor: pointer;
      }
      button:active { background: #3641f5; }
      @media (prefers-color-scheme: dark) {
        body { color: #f2f4f7; background: #101828; }
        p { color: #98a2b3; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Không có kết nối</h1>
      <p>Không thể tải ứng dụng vì thiết bị đang mất mạng. Hãy kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
