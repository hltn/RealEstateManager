server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── IP client thật (phục vụ rate limit đăng nhập của backend) ─────────────────
    # Chỉ tin header CF-Connecting-IP khi request đến từ cloudflared, IP TĨNH ĐÚNG MỘT địa chỉ khai
    # báo ở docker-compose.yml (network realestate_net, ipv4_address của service cloudflared).
    # Request vào thẳng cổng 80 publish của host có nguồn là gateway bridge, KHÔNG nằm trong danh sách
    # này nên CF-Connecting-IP do người gửi tự đặt bị bỏ qua (không thể giả IP để lách giới hạn).
    # TUYỆT ĐỐI KHÔNG mở rộng thành cả dải docker (vd 172.16.0.0/12, 10.0.0.0/8): kẻ tấn công sẽ giả được IP.
    # Muốn đổi IP: sửa ĐỒNG THỜI dòng dưới và subnet/ipv4_address trong docker-compose.yml, rồi build lại frontend.
    set_real_ip_from 10.213.77.250;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/manifest+json image/svg+xml;

    # ── Cache cho PWA (PT-030) ─────────────────────────────────────────────────────
    # Nguyên tắc: file KHÔNG băm tên (index.html, sw.js, manifest, offline.html) phải luôn được hỏi lại
    # máy chủ (`no-cache` = được lưu nhưng PHẢI revalidate bằng ETag/If-None-Match, trả 304 nếu không đổi),
    # nếu không trình duyệt giữ bản cũ sau deploy và người dùng kẹt ở phiên bản cũ. File băm tên
    # (/assets/*) đổi nội dung thì đổi tên nên cache vĩnh viễn được.
    # Không dùng `no-store` cho sw.js: không cần (trình duyệt vốn luôn revalidate file sw.js khi kiểm cập nhật)
    # và `no-store` mất luôn revalidate bằng 304.
    # LƯU Ý: `add_header` trong một `location` THAY (không cộng dồn) add_header cấp server; hiện cấp server
    # không có add_header nào. Nếu sau này thêm add_header cấp server (vd header bảo mật) thì phải lặp lại
    # chúng trong từng location dưới đây.
    # Mọi `location` bên dưới dùng `try_files $uri =404` để file thiếu trả 404 THẬT, không rơi về index.html
    # với mã 200 (trình duyệt sẽ nhận HTML thay vì JS/ảnh: lỗi MIME khó hiểu, hoặc SW cũ/mới vỡ sau deploy).
    # `add_header` mặc định chỉ gắn cho 2xx/3xx nên 404 không bị gắn `immutable`.

    # index.html: khớp cả `/index.html`, `/` (qua `index`) và mọi route SPA như `/customers/123`
    # (fallback `try_files ... /index.html` ở `location /` là redirect nội bộ, nginx tìm lại location và rơi vào đây).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Service worker + các file đăng ký/runtime không băm tên (workbox-<hash>.js có băm nhưng file nhỏ, no-cache cho an toàn;
    # registerSW.js chỉ có khi vite-plugin-pwa dùng injectRegister: 'script'). Thiếu thì 404, KHÔNG trả HTML.
    # (`(\.map)?` để file sourcemap của chúng, nếu có, cũng không rơi về index.html.)
    location ~ ^/(sw|registerSW|workbox-[^/]+)\.js(\.map)?$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    # mime.types của nginx:1.27 KHÔNG có `.webmanifest` (sẽ trả application/octet-stream; trình duyệt có thể bỏ qua
    # manifest) nên khai báo kiểu ngay trong location này. `types {}` rỗng + default_type chỉ áp dụng trong location này;
    # TUYỆT ĐỐI KHÔNG đặt `types { ... }` ở cấp server: nó THAY toàn bộ bảng mime kế thừa (mất text/css, image/png...).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /offline.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # JS/CSS/font băm tên do Vite sinh. `^~` để không bị location regex nào chen vào.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Icon PWA/favicon KHÔNG băm tên: cache 1 ngày (đổi icon thì tối đa 1 ngày trình duyệt mới thấy; icon hiếm khi đổi
    # và được tải mỗi lần cài đặt/hiển thị, không đáng để no-cache mỗi lần). Regex neo ở gốc (^/) và chỉ khớp tên
    # icon, để KHÔNG chạm vào /api/... (regex tổng quát kiểu `\.png$` sẽ ăn cả URL dưới /api/). Thiếu thì 404.
    location ~ ^/(pwa-[^/]+\.png|apple-touch-icon[^/]*\.png|maskable-icon[^/]*\.png|favicon[^/]*\.(ico|svg|png))$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Frontend SPA — fallback về index.html cho React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API sang backend
    location /api/ {
        # Upload ảnh CRM: backend cho tối đa 5 MB/file (main.ts limits.fileSize, ATTACHMENT_IMAGE_POLICY) dạng
        # multipart. 6m = 5 MB + dư cho phần boundary/header multipart; PHẢI >= giới hạn upload của backend,
        # nếu không nginx chặn 413 trước (mặc định nginx chỉ 1 MB). Tăng giới hạn backend thì tăng theo.
        client_max_body_size 6m;
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        # GHI ĐÈ (không dùng $proxy_add_x_forwarded_for): không cộng dồn header X-Forwarded-For do client gửi.
        # $remote_addr đã là IP thật sau real_ip ở trên; backend (TRUST_PROXY=1) lấy IP từ đây.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
