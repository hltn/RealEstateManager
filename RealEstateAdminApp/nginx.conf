server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── IP client thật (phục vụ rate limit đăng nhập của backend) ─────────────────
    # Chỉ tin header CF-Connecting-IP khi request đến từ cloudflared, IP TĨNH ĐÚNG MỘT địa chỉ khai
    # báo ở docker-compose.yml (network realestate_net, ipv4_address của service cloudflared).
    # Request vào thẳng cổng 80 publish của host có nguồn là gateway bridge, KHÔNG nằm trong danh sách
    # này nên CF-Connecting-IP do người gửi tự đặt bị bỏ qua (không thể giả IP để lách giới hạn).
    # TUYỆT ĐỐI KHÔNG mở rộng thành cả dải docker (vd 172.16.0.0/12, 10.0.0.0/8): kẻ tấn công sẽ giả được IP.
    # Muốn đổi IP: sửa ĐỒNG THỜI dòng dưới và subnet/ipv4_address trong docker-compose.yml, rồi build lại frontend.
    set_real_ip_from 10.213.77.250;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend SPA — fallback về index.html cho React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API sang backend
    location /api/ {
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        # GHI ĐÈ (không dùng $proxy_add_x_forwarded_for): không cộng dồn header X-Forwarded-For do client gửi.
        # $remote_addr đã là IP thật sau real_ip ở trên; backend (TRUST_PROXY=1) lấy IP từ đây.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
